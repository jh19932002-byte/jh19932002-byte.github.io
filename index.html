<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Portfolio</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --fg: #f2f2f4;
      --muted: #9a9aa3;
      --accent: #7c5cff;
      --card: #16161b;
      --line: #2a2a33;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 48px 40px;
    }
    .avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #ff7eb3);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700;
      margin-bottom: 24px;
    }
    h1 { font-size: 32px; margin-bottom: 4px; }
    .role { color: var(--muted); font-size: 16px; margin-bottom: 24px; }
    .intro { color: #d4d4dc; margin-bottom: 32px; }
    .section { margin-bottom: 24px; }
    .section h2 { font-size: 13px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      background: #1f1f27;
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
    }
    .links { display: flex; gap: 12px; flex-wrap: wrap; }
    .links a {
      color: var(--fg);
      text-decoration: none;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      transition: border-color .2s;
    }
    .links a:hover { border-color: var(--accent); }
    .links a.primary { background: var(--accent); border-color: var(--accent); color: white; }
    footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">J</div>
    <h1>jh19932002</h1>
    <p class="role">Full-Stack Developer</p>
    <p class="intro">
      안녕하세요! 웹 서비스를 만들고 운영하는 개발자입니다. 깔끔한 UI와 안정적인 백엔드에 관심이 많습니다.
    </p>

    <section class="section">
      <h2>Skills</h2>
      <div class="tags">
        <span class="tag">TypeScript</span>
        <span class="tag">React</span>
        <span class="tag">Next.js</span>
        <span class="tag">Node.js</span>
        <span class="tag">Python</span>
        <span class="tag">PostgreSQL</span>
      </div>
    </section>

    <section class="section">
      <h2>Links</h2>
      <div class="links">
        <a class="primary" href="mailto:hello@example.com">Email</a>
        <a href="https://github.com/jh19932002-byte" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </section>

    <footer>© 2026 jh19932002. All rights reserved.</footer>
  </main>
</body>
</html>
