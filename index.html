<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Portfolio</title>
  <style>
    :root {
      --bg: #101214;
      --fg: #d9dde2;
      --muted: #8e959d;
      --accent: #5f7a96;
      --card: #181b1e;
      --line: #2a2f35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 48px 40px;
      position: relative;
      z-index: 1;
    }
    .avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700;
      margin-bottom: 24px;
    }
    h1 { font-size: 32px; margin-bottom: 4px; }
    .role { color: var(--muted); font-size: 16px; margin-bottom: 24px; }
    .intro { color: var(--fg); opacity: 0.85; margin-bottom: 32px; }
    .section { margin-bottom: 24px; }
    .section h2 { font-size: 13px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      background: #20242a;
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
    }
    .links { display: flex; gap: 12px; flex-wrap: wrap; }
    .links a {
      color: var(--fg);
      text-decoration: none;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      transition: border-color .2s;
    }
    .links a:hover { border-color: var(--accent); }
    body { overflow-x: hidden; }
    .shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .shape { position: absolute; border: 1px solid rgba(95, 122, 150, 0.32); }
    .shape.circle { width: 260px; height: 260px; border-radius: 50%; top: 7%; left: 5%; }
    .shape.ring { width: 150px; height: 150px; border-radius: 50%; border-style: dashed; bottom: 10%; left: 9%; opacity: 0.55; }
    .shape.square {
      width: 150px; height: 150px; border-radius: 22px;
      bottom: 9%; right: 7%; transform: rotate(18deg);
      animation: drift 11s ease-in-out infinite;
    }
    .shape.bar {
      height: 2px; width: 300px; border: none; border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      top: 52%; left: -60px; transform: rotate(-14deg); opacity: 0.45;
    }
    .shape.dot {
      width: 8px; height: 8px; border-radius: 50%; border: none;
      background: var(--accent); top: 24%; right: 16%; opacity: 0.7;
      animation: pulse 4s ease-in-out infinite;
    }
    .shape.triangle {
      width: 0; height: 0; border: none; top: 16%; right: 14%;
      border-left: 34px solid transparent;
      border-right: 34px solid transparent;
      border-bottom: 58px solid rgba(95, 122, 150, 0.18);
    }
    @keyframes drift {
      0%, 100% { transform: rotate(18deg) translateY(0); }
      50% { transform: rotate(18deg) translateY(-16px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.5); opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shape.square, .shape.dot { animation: none; }
    }
    .links a.primary { background: var(--accent); border-color: var(--accent); color: white; }
    footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="shapes" aria-hidden="true">
    <div class="shape circle"></div>
    <div class="shape ring"></div>
    <div class="shape square"></div>
    <div class="shape bar"></div>
    <div class="shape dot"></div>
    <div class="shape triangle"></div>
  </div>
  <main class="card">
    <div class="avatar">J</div>
    <h1>jh19932002</h1>
    <p class="role">Full-Stack Developer</p>
    <p class="intro">
      안녕하세요! 웹 서비스를 만들고 운영하는 개발자입니다. 깔끔한 UI와 안정적인 백엔드에 관심이 많습니다.
    </p>

    <section class="section">
      <h2>Skills</h2>
      <div class="tags">
        <span class="tag">TypeScript</span>
        <span class="tag">React</span>
        <span class="tag">Next.js</span>
        <span class="tag">Node.js</span>
        <span class="tag">Python</span>
        <span class="tag">PostgreSQL</span>
      </div>
    </section>

    <section class="section">
      <h2>Links</h2>
      <div class="links">
        <a class="primary" href="mailto:hello@example.com">Email</a>
        <a href="https://github.com/jh19932002-byte" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </section>

    <footer>© 2026 jh19932002. All rights reserved.</footer>
  </main>
</body>
</html>
